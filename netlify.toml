[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.19.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/services/tax-planning"
  to = "/tax-planning/"
  status = 301

[[redirects]]
  from = "/services/settlement-options"
  to = "/services/offer-in-compromise-with-utah-tax-attorney/"
  status = 301

[[redirects]]
  from = "/services/settle-tax-debt-today"
  to = "/services/offer-in-compromise-with-utah-tax-attorney/"
  status = 301

[[redirects]]
  from = "/articles/offer-in-compromise-guide-2024"
  to = "/services/offer-in-compromise-with-utah-tax-attorney/"
  status = 301

[[redirects]]
  from = "/articles/irs-audit-defense-strategies"
  to = "/services/audit-help/"
  status = 301

[[redirects]]
  from = "/articles/can-taxes-be-discharged-in-bankruptcy"
  to = "/services/chapter-7-bankruptcy/"
  status = 301

[[redirects]]
  from = "/articles/defending-against-irs-wage-garnishment-utah"
  to = "/services/bank-levy-wage-garnishment/"
  status = 301

[[redirects]]
  from = "/articles/strategic-business-tax-planning-utah"
  to = "/services/tax-planning-for-businesses/"
  status = 301

[[redirects]]
  from = "/articles/innocent-spouse-relief-explained-utah"
  to = "/services/innocent-spouse-relief/"
  status = 301
