[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.19.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/services/tax-planning"
  to = "/tax-planning/"
  status = 301

[[redirects]]
  from = "/services/settlement-options"
  to = "/services/offer-in-compromise-with-utah-tax-attorney/"
  status = 301

[[redirects]]
  from = "/services/settle-tax-debt-today"
  to = "/services/offer-in-compromise-with-utah-tax-attorney/"
  status = 301

[[redirects]]
